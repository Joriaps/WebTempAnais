name: Publicar en GitHub Pages (rama gh-pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # solo para publicar en gh-pages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Construir web estática
        # Si content/site.json → seo.siteUrl está vacío, usa la URL de GitHub Pages del repositorio
        run: node static/build.mjs
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - name: Comprobar enlaces internos
        run: node static/check-links.mjs
      - name: Publicar en la rama gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd static/dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar ${GITHUB_SHA::7}"
          # La clave va en una cabecera temporal, no en la dirección
          AUTH=$(printf "x-access-token:%s" "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"
          git push -q -f "https://github.com/$REPO.git" gh-pages
